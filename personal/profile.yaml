bio: |
  I'm Yousha, a Computer Science and Engineering student at Daffodil International University. My CGPA is 3.50, and I'm still early in the degree, learning C and Java and getting comfortable with HTML.

  Most of my programming so far is course work. The one I'm proudest of is StockSync, a warehouse inventory program in C that I built for the CSE214 Algorithm Lab. It runs from a text menu and covers stock, search, sorting and reports.

  Outside class I tutor school students from Play to Class 10 in maths, science, English and ICT. I was also games prefect at school, where I organised inter-house games and led the football team. In goal is where I'm happiest.

