<!doctype html>
<!-- Source for personal/cv.pdf.
     Regenerate with: python tools/cv/make_cv.py

     The placeholders {{name}}, {{role}} and so on are filled in from
     personal/profile.yaml by that script, so the CV always matches the
     profile. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{name}} — CV</title>
<style>
  @page { size: A4; margin: 10mm 12mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: #1a2330;
    font: 9.4pt/1.38 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .accent { color: #0e7490; }

  header { border-bottom: 2.5pt solid #0e7490; padding-bottom: 7pt; margin-bottom: 9pt; }
  h1 { margin: 0; font-size: 19pt; letter-spacing: -.4pt; font-weight: 700; }
  .role { color: #0e7490; font-size: 10.6pt; margin-top: 1.5pt; font-weight: 600; }
  .contact {
    margin-top: 5pt; font-size: 8.2pt; color: #4a5666;
    display: flex; flex-wrap: wrap; gap: 1pt 13pt;
  }

  h2 {
    font-size: 8.6pt; text-transform: uppercase; letter-spacing: 1.1pt;
    color: #0e7490; margin: 7.5pt 0 4pt; padding-bottom: 2.2pt;
    border-bottom: .6pt solid #d3dbe4;
  }

  .entry { margin-bottom: 5pt; break-inside: avoid; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10pt; }
  .entry .what { font-weight: 650; font-size: 9.9pt; }
  .entry .when { color: #5c6a7d; font-size: 8.4pt; white-space: nowrap; }
  .entry .where { color: #0e7490; font-size: 9.2pt; font-weight: 600; }
  .entry .detail { color: #3d4a5c; margin-top: 1pt; }

  ul.skills { list-style: none; margin: 0; padding: 0; }
  ul.skills li { margin-bottom: 2.4pt; font-size: 9pt; }
  ul.skills b { color: #26303f; }
  ul.skills span { color: #3d4a5c; }

  .pills { margin: 0; padding: 0; list-style: none; }
  .pills li {
    display: inline-block; border: .6pt solid #c9d4e0; border-radius: 9pt;
    padding: 1pt 6.5pt; margin: 0 3pt 2.5pt 0; font-size: 8.4pt; color: #33404f;
  }

  .two { column-count: 2; column-gap: 18pt; margin: 0; padding-left: 11pt; }
  .two li { margin-bottom: 1.5pt; font-size: 8.4pt; break-inside: avoid; }

  .links { font-size: 8.4pt; color: #4a5666; }
  .links span { color: #0e7490; }
</style>
</head>
<body>

<header>
  <h1>{{name}}</h1>
  <div class="role">{{role}}</div>
  <div class="contact">
    <span>{{email}}</span>
    <span>{{phone}}</span>
    <span>{{location}}</span>
    <span>{{github_label}}</span>
    <span>{{linkedin_label}}</span>
  </div>
</header>

<h2>Profile</h2>
<p style="margin:0">{{summary}}</p>

<h2>Experience</h2>
{{experience}}

<h2>Education</h2>
{{education}}

<h2>Projects</h2>
{{projects}}

<h2>Skills</h2>
<ul class="skills">
  {{skills}}
</ul>

<h2>Languages</h2>
<ul class="pills">
  {{languages}}
</ul>

<h2>Achievements</h2>
<ul class="two">
  {{achievements}}
</ul>

</body>
</html>
